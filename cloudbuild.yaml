steps:
  # Build the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_AR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME/website:$COMMIT_SHA",
        ".",
        "--build-arg",
        "REACT_APP_FIREBASE_API_KEY=${_REACT_APP_FIREBASE_API_KEY}",
        "--build-arg",
        "REACT_APP_FIREBASE_AUTH_DOMAIN=${_REACT_APP_FIREBASE_AUTH_DOMAIN}",
        "--build-arg",
        "REACT_APP_FIREBASE_PROJECT_ID=${_REACT_APP_FIREBASE_PROJECT_ID}",
        "--build-arg",
        "REACT_APP_FIREBASE_STORAGE_BUCKET=${_REACT_APP_FIREBASE_STORAGE_BUCKET}",
        "--build-arg",
        "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${_REACT_APP_FIREBASE_MESSAGING_SENDER_ID}",
        "--build-arg",
        "REACT_APP_FIREBASE_APP_ID=${_REACT_APP_FIREBASE_APP_ID}",
        "--build-arg",
        "REACT_APP_FIREBASE_MEASUREMENT_ID=${_REACT_APP_FIREBASE_MEASUREMENT_ID}",
        "--build-arg",
        "REACT_APP_EMAILJS_PUBLIC_KEY=${_REACT_APP_EMAILJS_PUBLIC_KEY}",
        "--build-arg",
        "REACT_APP_EMAILJS_SERVICE_ID=${_REACT_APP_EMAILJS_SERVICE_ID}",
        "--build-arg",
        "REACT_APP_EMAILJS_TEMPLATE_ID=${_REACT_APP_EMAILJS_TEMPLATE_ID}",
      ]
  # Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["push", "$_AR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME/website:$COMMIT_SHA"]
  # Deploy image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "$_SERVICE_NAME",
        "--image",
        "$_AR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME/website:$COMMIT_SHA",
        "--region",
        "europe-west1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "80",
      ]
images:
  - "$_AR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME/website:$COMMIT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
